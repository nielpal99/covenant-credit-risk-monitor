[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covenant-credit-risk-monitor"
version = "0.1.0"
description = "Evidence-linked SEC debt and covenant monitoring prototype"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "llama-cloud>=2.8",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ccrm = "ccrm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: requires the generated local SEC corpus"]
